name: Preview

# Stand-in for a game repo using the split reusable workflows: a (simulated) build job uploads an
# artifact, VaultLearningGames/vault-publisher's publish-preview.yml publishes it to
# https://cdn.vaultlearninggames-staging.org/fielddaylab/publisher-test/<branch>/ , then `verify` checks the
# CDN's headers. Deleting a branch removes its preview.
on:
  push:
  delete:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  # A real game repo would use VaultLearningGames/vault-publisher/.github/workflows/unity-build.yml@v1 here.
  build:
    if: github.event_name != 'delete'
    runs-on: ubuntu-latest
    outputs:
      artifact: webgl-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Simulate a Unity WebGL build
        run: node simulate-build.mjs build
      - uses: actions/upload-artifact@v7
        with:
          name: webgl-${{ github.sha }}
          path: build
          retention-days: 3

  preview:
    needs: build
    uses: VaultLearningGames/vault-publisher/.github/workflows/publish-preview.yml@v1
    with:
      game: publisher-test
      artifact: ${{ needs.build.outputs.artifact }}

  verify:
    needs: preview
    runs-on: ubuntu-latest
    steps:
      - name: Check the CDN serves it correctly
        env:
          URL: ${{ needs.preview.outputs.url }}
        run: |
          set -euo pipefail
          # ?v= skips any copy the edge cached from a previous push (cache key includes the query string).
          q="?v=${GITHUB_SHA}"
          header() { curl -fsS -H 'Accept-Encoding: br, gzip' -o /dev/null -D - "$URL$1$q" | tr -d '\r' | grep -i "^$2:" | cut -d' ' -f2- || true; }
          expect() {
            local got; got=$(header "$1" "$2")
            if [ "$got" = "$3" ]; then echo "✅ $1 $2: $got"; else echo "❌ $1 $2: expected '$3', got '$got'"; fail=1; fi
          }
          fail=0
          if curl -fsS "$URL$q" | grep -q "${GITHUB_SHA:0:7}"; then echo "✅ folder URL serves this commit's index.html"; else echo "❌ folder URL"; fail=1; fi
          expect "" x-robots-tag "noindex, nofollow"
          expect "Build/test.wasm.br" content-type "application/wasm"
          expect "Build/test.wasm.br" content-encoding "br"
          expect "Build/test.framework.js.gz" content-type "text/javascript; charset=utf-8"
          expect "Build/test.framework.js.gz" content-encoding "gzip"
          expect "Build/test.data.unityweb" content-encoding ""
          echo "Open $URL in a browser for the in-page checks."
          exit $fail

  remove-preview:
    if: github.event_name == 'delete'
    uses: VaultLearningGames/vault-publisher/.github/workflows/publish-preview.yml@v1
    with:
      game: publisher-test
